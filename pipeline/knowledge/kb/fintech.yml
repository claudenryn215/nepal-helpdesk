# FinTech knowledge base — eSewa, Khalti, .com.np domains.

- id: esewa-kyc-verification-error
  niche: fintech
  title: "eSewa KYC Verification Not Completing — Fixes (2026)"
  description: "eSewa KYC stuck on 'under review' or failing? Fix document upload issues, photo selfie mismatches, and how long eSewa KYC takes to approve."
  keywords:
    - "esewa kyc not working"
    - "esewa verification failed"
    - "esewa kyc under review"
    - "इसेवा केवाईसी"
    - "esewa document upload error"
    - "esewa full kyc"
  tags: [esewa, kyc, wallet, verification]
  sources:
    - https://esewa.com.np/support
    - https://esewa.com.np
  summary:
    - problem: "KYC stuck on 'under review'"
      cause: "Document quality or backlogs"
      fix: "Re-submit with clear scans; wait up to 3 working days"
    - problem: "Selfie verification mismatch"
      cause: "Photo vs document face difference"
      fix: "Retake selfie in good light, same day, no filters"
    - problem: "Document rejected instantly"
      cause: "Blurry or expired documents"
      fix: "Scan properly, check document validity, re-upload"
  steps:
    - title: "Check your KYC level needs"
      body: |
        1. Open the eSewa app and go to Profile > KYC.
        2. See which level you are on (Basic/Full) and what is required.
        3. Full KYC usually needs citizenship/passport plus a selfie.
    - title: "Prepare documents correctly"
      body: |
        1. Use the original citizenship/passport — no copies of copies.
        2. Keep the document fully visible, all four corners, no reflection.
        3. File size and format: follow the app's on-screen requirements.
    - title: "Take the selfie properly"
      body: |
        1. Good daylight, no glasses or cap.
        2. Face must match the ID document — same hair length/style helps.
        3. No filters, no editing, straight-facing camera.
    - title: "Resubmit without spamming"
      body: |
        1. If rejected, read the reason and fix that specific point.
        2. Resubmitting identical files will fail again — change the document quality.
        3. Repeated same-day attempts may trigger a cooldown; wait a day.
    - title: "What 'under review' means"
      body: |
        1. It usually clears within 1–3 working days.
        2. Review happens on business days only.
        3. If it stays longer than a week, contact eSewa support with your registered number.
    - title: "Escalate with the right channel"
      body: |
        1. eSewa help: 166-00-15000 or esewa.com.np/support.
        2. Share your eSewa ID and the exact rejection reason.
        3. For unresolved cases, file a complaint at the Nepal Rastra Bank (Nepal Rastra Bank helpline for digital wallet issues).
  troubleshooting:
    - problem: "Can't find KYC section"
      cause: "Old app version"
      fix: "Update the eSewa app from the store"
    - problem: "Name mismatch between NID and eSewa"
      cause: "Registered name differs from document"
      fix: "Update your name in the app first (requires support approval)"
    - problem: "Mobile number changed"
      cause: "Number swap breaks verification"
      fix: "Contact support with the old number details to transfer the account"
  faq:
    - q: "How long does eSewa KYC take?"
      a: "Usually 1–3 working days if documents are clear."
    - q: "Can I use eSewa without full KYC?"
      a: "Yes, with limited transaction limits; full KYC raises the limits."
    - q: "Is KYC mandatory for eSewa?"
      a: "Yes, wallet rules from Nepal Rastra Bank require KYC for wallet services."
  affiliate: "none"

- id: khalti-wallet-topup-error
  niche: fintech
  title: "Khalti Top-Up or Payment Failing — Step-by-Step Fixes (2026)"
  description: "Khalti wallet top-up not working? Fix bank connect errors, card declines, KYC limits, merchant payment failures, and the 02-5970017 support process."
  keywords:
    - "khalti top up not working"
    - "khalti payment failed"
    - "khalti bank connect error"
    - "खल्ती टप अप"
    - "khalti transaction failed"
  tags: [khalti, wallet, payment, topup]
  sources:
    - https://khalti.com/help
    - https://khalti.com
  summary:
    - problem: "Bank connect top-up fails"
      cause: "Bank server or session issue"
      fix: "Retry after 10 minutes; try card instead of bank connect"
    - problem: "Card declined"
      cause: "Card limits or 3DS not completed"
      fix: "Check card limit, complete 3DS, try another card"
    - problem: "Merchant payment error"
      cause: "Merchant integration issue"
      fix: "Wait, retry once; if repeated, pay via another wallet"
  steps:
    - title: "Identify the failure type"
      body: |
        1. Note the exact error message and the time it failed.
        2. Check whether the amount was deducted from your bank/card.
        3. Different errors need different fixes — match yours below.
    - title: "Fix bank connect top-up failures"
      body: |
        1. Top-ups via bank connect depend on the bank's gateway — retry after 10 minutes.
        2. Keep the Khalti app updated; old versions break bank links.
        3. Try topping up with a card instead of bank connect.
    - title: "Fix card declined errors"
      body: |
        1. Check your daily card limit with your bank.
        2. Ensure you complete the 3DS verification pop-up.
        3. Try a different card, or confirm international usage is enabled if required.
    - title: "Check wallet limits and KYC"
      body: |
        1. Open Settings > KYC in Khalti and check your verification level.
        2. Unverified wallets have low transaction limits — upgrade KYC.
        3. If you are at the limit, split the payment across days.
    - title: "Fix merchant payment failures"
      body: |
        1. Many failures are on the merchant side, not your wallet.
        2. Wait 5 minutes and try once more.
        3. If it still fails, pay with eSewa or bank transfer instead, then dispute the charge with the merchant.
    - title: "When to contact Khalti support"
      body: |
        1. Use the in-app 'Help & Support' with the transaction ID (starts with 'txn-').
        2. If money was deducted but not credited, report within 48 hours.
        3. Call or email via khalti.com/help with the error screenshot.
  troubleshooting:
    - problem: "Khalti app shows 'something went wrong'"
      cause: "App or session issue"
      fix: "Force close, restart app, or reinstall (KYC data stays on server)"
    - problem: "OTP from bank not arriving"
      cause: "Bank SMS issues"
      fix: "Use the bank's own app OTP if configured; check SMS inbox spam"
    - problem: "Refund not appearing"
      cause: "Merchant refund processing time"
      fix: "Merchants refund in 3-7 working days; check after that"
  faq:
    - q: "How long does a Khalti refund take?"
      a: "Typically 3–7 working days after the merchant initiates it."
    - q: "Why is my Khalti transaction limit low?"
      a: "Limits depend on your KYC level — upgrade in the app to raise them."
    - q: "Does Khalti charge for top-ups?"
      a: "Wallet top-ups via bank/card generally do not carry extra charges; merchant fees are shown at checkout."
  affiliate: "none"

- id: free-com-np-domain-registration
  niche: fintech
  title: "Free .com.np Domain Registration — Complete Step-by-Step (2026)"
  description: "Register a free .com.np domain in Nepal: create a register.com.np account, upload citizenship, set nameservers, and avoid the top 3 rejection reasons."
  keywords:
    - "free com.np domain"
    - ".com.np domain registration"
    - "register.com.np"
    - "नि:शुल्क डोमेन नेपाल"
    - "free domain nepal"
    - "com.np nameservers"
  tags: [domain, com.np, mercantile, free]
  sources:
    - https://register.com.np
    - https://www.mercantile.com.np
  summary:
    - problem: "Application rejected"
      cause: "Blurry citizenship scan or missing nameservers"
      fix: "Re-scan clearly and configure nameservers before applying"
    - problem: "Nameserver not accepted"
      cause: "Nameservers not resolvable"
      fix: "Use hosting-provider nameservers that resolve publicly"
    - problem: "Slow approval"
      cause: "Manual verification by Mercantile"
      fix: "Expect 1–3 business days; weekends don't count"
  steps:
    - title: "Prepare what you need"
      body: |
        1. A valid citizenship card (front and back scan) or passport for foreigners.
        2. A working email address.
        3. Two nameservers from your hosting provider (e.g., ns1.example.com / ns2.example.com).
    - title: "Create an account at register.com.np"
      body: |
        1. Visit `register.com.np` (Mercantile Communications — the only registrar for .np).
        2. Sign up with your real email and contact details.
        3. Confirm your email before continuing.
    - title: "Search for your domain"
      body: |
        1. Use the search box to check availability.
        2. Good names are still available — try short business or project names.
        3. You can register `.com.np`, `.org.np`, `.net.np` etc. per your eligibility.
    - title: "Fill the application accurately"
      body: |
        1. Enter your name, address, and phone exactly as on your ID.
        2. Choose your purpose (business, organization, or personal).
        3. Provide the two nameservers — this is the #1 rejection reason when missing.
    - title: "Upload documents and submit"
      body: |
        1. Upload the citizenship scan — clear, uncropped, all four corners visible.
        2. Use JPEG or PDF as required; blurry scans get rejected.
        3. Submit and note the application/reference number.
    - title: "After approval: point DNS and renew"
      body: |
        1. Approval takes 1–3 business days; you will get an email.
        2. Configure your records (A, CNAME) at the hosting provider after approval.
        3. .com.np is free to renew — but you must renew on time or it is released.
  troubleshooting:
    - problem: "Application stuck for over a week"
      cause: "Manual queue backlog"
      fix: "Email hostmaster@mercantile.com.np with your application number"
    - problem: "Domain registered to someone else with similar name"
      cause: "First-come policy"
      fix: "Try a variation or different second-level (org.np vs com.np)"
    - problem: "Ownership transfer"
      cause: "You need both parties"
      fix: "Contact Mercantile with signed documents from current and new owner"
  faq:
    - q: "Is .com.np really free?"
      a: "Yes — registration and renewal are free for Nepali citizens and organizations; you only pay for hosting."
    - q: "Can foreigners register .com.np domains?"
      a: "Foreigners with a valid passport and a Nepal-related purpose can apply; approval is at the registrar's discretion."
    - q: "How long does .com.np approval take?"
      a: "Usually 1–3 business days because verification is manual."
    - q: "Can I transfer my .com.np to GoDaddy?"
      a: "No — .np domains stay with Mercantile; you can change nameservers and ownership with their approval."
  affiliate: "none"

- id: esewa-khalti-merchant-integration
  niche: fintech
  title: "eSewa / Khalti Payment Gateway Integration for Small Businesses (2026)"
  description: "Integrate eSewa or Khalti payment gateway for your Nepal business: requirements, KYC documents, webhook setup, testing, and going live — without a developer."
  keywords:
    - "esewa merchant registration"
    - "khalti payment gateway integration"
    - "esewa api integration nepal"
    - "payment gateway nepal business"
    - "खल्ती व्यापारी"
  tags: [esewa, khalti, merchant, payment-gateway]
  sources:
    - https://merchant.esewa.com.np
    - https://admin.khalti.com
  summary:
    - problem: "Merchant application rejected"
      cause: "Incomplete business documents"
      fix: "Submit PAN, company registration, and bank account details"
    - problem: "Sandbox works, live fails"
      cause: "Live keys not activated or domain mismatch"
      fix: "Register the exact live domain; use the live secret key"
    - problem: "Payment success not reaching your site"
      cause: "Webhook/callback URL misconfigured"
      fix: "Verify callback URL and signature verification code"
  steps:
    - title: "Check business requirements"
      body: |
        1. You need a registered business: PAN/VAT certificate or company registration.
        2. A bank account in the business name (or verified owner name).
        3. A live website or app with a working checkout page.
    - title: "Register as a merchant"
      body: |
        1. eSewa: apply at merchant.esewa.com.np with business documents.
        2. Khalti: apply at admin.khalti.com with the same documents.
        3. Both review within a few working days; expect a verification call.
    - title: "Get your keys and set up the sandbox"
      body: |
        1. eSewa provides a Merchant Code and Secret Key.
        2. Khalti provides a Public Key and Secret Key.
        3. Start integration against the sandbox (test) environment.
    - title: "Integrate the payment link or API"
      body: |
        1. No-code option: generate a payment link/QR from the merchant dashboard.
        2. API option: add the checkout call on your site with the merchant keys.
        3. Use the official documentation for the exact endpoint and fields.
    - title: "Configure the callback/webhook"
      body: |
        1. Set the callback URL where the wallet sends the result after payment.
        2. On the server, verify the signature with your secret key before marking paid.
        3. Test a real (small) payment in sandbox mode first.
    - title: "Go live"
      body: |
        1. Confirm the live domain in the merchant dashboard — mismatches break live payments.
        2. Switch keys from sandbox to live and run one real transaction.
        3. Keep transaction logs for refunds and disputes.
  troubleshooting:
    - problem: "Sandbox payment works but live URL fails"
      cause: "Live keys or domain not activated"
      fix: "Check merchant dashboard for live status; re-enter domain exactly"
    - problem: "Customer paid but order not updated"
      cause: "Callback not verified"
      fix: "Check server logs; ensure callback path is public (no auth wall)"
    - problem: "Refund API errors"
      cause: "Wrong transaction reference"
      fix: "Use the wallet transaction ID from the dashboard, not your order ID"
  faq:
    - q: "Does eSewa/Khalti charge merchant fees?"
      a: "Yes, each gateway has per-transaction fees and settlement cycles — check the merchant agreement."
    - q: "How long does settlement take?"
      a: "Typically 1–2 working days after successful transaction matching."
    - q: "Do I need a developer for integration?"
      a: "For payment links and QR, no. For API checkout, basic web development is needed."
  affiliate: "none"
