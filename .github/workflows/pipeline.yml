name: Content Pipeline

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund

      - name: Run content pipeline
        run: python pipeline/pipeline.py --build-check
        env:
          OMNIROUTE_BASE_URL: ${{ secrets.OMNIROUTE_BASE_URL }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_MODEL: ${{ secrets.OMNIROUTE_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}

      - name: Generate seed comments for new articles
        run: python pipeline/seed_comments.py

      - name: Commit and push content changes
        run: |
          git config user.name "nepal-helpdesk-bot"
          git config user.email "bot@nepalhelpdesk.pages.dev"
          git add -A
          if git diff --cached --quiet; then
            echo "No content changes; nothing to commit."
          else
            git commit -m "pipeline: publish verified guides [auto]"
            git push
          fi

      - name: Apply D1 schema and seeds, deploy to Cloudflare Pages
        if: env.CF_API_TOKEN != ''
        working-directory: site
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute nepal-helpdesk-db --remote --file=db/schema.sql
          npx wrangler d1 execute nepal-helpdesk-db --remote --file=../pipeline/state/seed_comments.sql
          npx wrangler pages deploy
